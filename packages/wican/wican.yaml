      device_class: door
      value_template: '{{ (value_json["BCM-Passenger-Ajar"]) | round(0) }}'
      payload_on: '1'
      payload_off: '0'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    #Detect Slider Door Status
    - name: "Slider Door Status"
      unique_id: wican_slider_door_status
      state_topic: "wican/bcm-slider-ajar"
      icon: mdi:car-door
      device_class: door
      value_template: '{{ (value_json["BCM-Slider-Ajar"]) | round(0)}}'
      payload_on: '1'
      payload_off: '0'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    #Detect Rear Door Status
    - name: "Rear Door Status"
      unique_id: wican_rear_door_status
      state_topic: "wican/bcm-rear-ajar"
      icon: mdi:car-door
      device_class: door
      value_template: '{{ (value_json["BCM-Rear-Ajar"]) | round(0) }}'
      payload_on: '1'
      payload_off: '0'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

  sensor:

#### OBD Standard Interface ####

    - name: "Vehicle Speed"
      unique_id: wican_obd_vehicle_speed
      state_topic: "wican/0D-VehicleSpeed"
      unit_of_measurement: "mph"
      state_class: measurement
      icon: mdi:speedometer
      # convert to MPH (from KPH)
      value_template: '{{ (value_json["0D-VehicleSpeed"] | default(0) * 0.621371) | round }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Engine Speed"
      unique_id: wican_obd_rpm
      state_topic: "wican/0C-EngineRPM"
      unit_of_measurement: "RPM"
      state_class: measurement
      icon: mdi:engine
      # no conversion needed
      value_template: '{{ (value_json["0C-EngineRPM"] | default(0)) | round }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Odometer"
      unique_id: wican_obd_odometer
      state_topic: "wican/A6-Odometer"
      unit_of_measurement: "mi"
      device_class: distance
      icon: mdi:counter
      # convert to miles from kilometers
      value_template: '{{ (value_json["A6-Odometer"] * 0.621371) | round }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Fuel Level"
      unique_id: wican_obd_tank_level
      state_topic: "wican/2F-FuelTankLevel"
      unit_of_measurement: "%"
      device_class: moisture
      state_class: measurement
      icon: mdi:gas-station
      # percent full
      value_template: '{{ value_json["2F-FuelTankLevel"] | default(0) | round }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Barometric Pressure"
      unique_id: wican_obd_barometric
      state_topic: "wican/33-AbsBaroPres"
      unit_of_measurement: "psi"
      device_class: pressure
      state_class: measurement
      icon: mdi:gauge
      # kPa → psi
      value_template: '{{ (value_json["33-AbsBaroPres"] * 0.145038 | default(0)) | round(1) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Manifold Pressure"
      unique_id: wican_obd_intake_pressure
      state_topic: "wican/0B-IntakeManiAbsPress"
      unit_of_measurement: "psi"
      device_class: pressure
      state_class: measurement
      icon: mdi:gauge
      # kPa → psi
      value_template: '{{ (value_json["0B-IntakeManiAbsPress"] * 0.145038 | default(0)) | round(1) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Engine Torque Reference"
      unique_id: wican_obd_torque_ref
      state_topic: "wican/63-EngRefTorq"
      unit_of_measurement: "Nm"
      state_class: measurement
      icon: mdi:engine
      entity_category: diagnostic
      # reference torque
      value_template: '{{ value_json["63-EngRefTorq"] | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Engine Torque Percent"
      unique_id: wican_obd_torque_pct
      state_topic: "wican/62-ActualEngTorqPct"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:engine
      # percent of reference
      value_template: '{{ value_json["62-ActualEngTorqPct"] | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Engine Load"
      unique_id: wican_obd_engine_load
      state_topic: "wican/04-CalcEngineLoad"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:engine
      # percent load
      value_template: '{{ value_json["04-CalcEngineLoad"] | default(0) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Throttle Position"
      unique_id: wican_obd_throttle_pos
      state_topic: "wican/11-ThrottlePosition"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:speedometer
      # percent open
      value_template: '{{ value_json["11-ThrottlePosition"] | default(0) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Ambient Air Temp"
      unique_id: wican_odb_ambient_air_temp
      state_topic: "wican/46-AmbientAirTemp"
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer
      # convert from °C to °F
      value_template: '{{ ((value_json["46-AmbientAirTemp"] | default(0) * 9/5) + 32) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

#### Powertrain Control Module ####

    - name: "Drive Mode"
      unique_id: wican_pcm_drive_mode
      state_topic: "wican/DRIVE_MODE"
      icon: mdi:car-shift-pattern
      # raw value
      value_template: >
        {% set gear = value_json["DRIVE_MODE"] | int %}
        {% if gear == 0 %} Normal
        {% elif gear == 6 %} Eco
        {% elif gear == 5 %} Slippery
        {% elif gear == 8 %} Mud/Ruts
        {% elif gear == 3 %} Tow/Haul
        {% else %} Error
        {% endif %}
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Engine Coolant Temp"
      unique_id: wican_pcm_engine_coolant_temp
      state_topic: "wican/COOLANT_TMP"
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer-water
      # raw value
      value_template: '{{ ((value_json["COOLANT_TMP"] | default(0) * 9/5) + 32) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Fuel Pressure Actual"
      unique_id: wican_pcm_fuel_pressure_actual
      state_topic: "wican/FUEL_PRESSURE"
      unit_of_measurement: "psi"
      device_class: pressure
      state_class: measurement
      icon: mdi:gauge
      # convert from kPa to psi
      value_template: '{{ (value_json["FUEL_PRESSURE"] | default(0) * 0.145038) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Fuel Pressure Desired"
      unique_id: wican_pcm_fuel_pressure_desired
      state_topic: "wican/FUEL_PRESSURE_D"
      unit_of_measurement: "psi"
      device_class: pressure
      state_class: measurement
      icon: mdi:gauge
      # convert from kPa to psi
      value_template: '{{ (value_json["FUEL_PRESSURE_D"] | default(0) * 0.145038) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Alternator Duty Cycle"
      unique_id: wican_pcm_alternator_duty_cycle
      state_topic: "wican/ALT_DUTY"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:percent
      # raw value - Adjusted from base-8 to base-10, then dvivided by 2 for dual-alternators
      value_template: '{{ value_json["ALT_DUTY"] | default(0) * 100 / 128 /2| round(0)  }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Fuel Pump Duty Cycle"
      unique_id: wican_pcm_fuel_pump_duty_cycle
      state_topic: "wican/FUEL_PUMP_DUTY"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:percent
      # raw value
      value_template: '{{ value_json["FUEL_PUMP_DUTY"] | default(0) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Fuel Rate"
      unique_id: b3668d3f-177e-47dd-9d7c-c7724c5c57c9
      state_topic: "wican/FUEL_RATE"
      unit_of_measurement: "g/s"
      state_class: measurement
      icon: mdi:chart-line
      # grams per second
      value_template: '{{ (value_json["FUEL_RATE"] | default(0)) | round(2) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Fuel System Status"
      unique_id: wican_pcm_fuel_system_status
      state_topic: "wican/FUEL_SYS_STAT"
      icon: mdi:engine
      value_template: >
        {% set gear = value_json["FUEL_SYS_STAT"] | int %}
        {% if gear == 0 %} Engine Off
        {% elif gear == 1 %} Open Loop - Low Engine Temp
        {% elif gear == 2 %} Closed Loop
        {% elif gear == 4 %} Open Loop - Engine Load
        {% elif gear == 8 %} Open Loop - System Failure
        {% elif gear == 16 %} Closed Loop - System Failure
        {% else %} Error
        {% endif %}
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Intake Air Temp"
      unique_id: wican_pcm_intake_air_temp
      state_topic: "wican/INTAKE_AIR_TMP"
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      icon: mdi:air-filter
      # convert from °C to °F
      value_template: '{{ ((value_json["INTAKE_AIR_TMP"] | default(0) * 9/5) + 32) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Intake Air Temp 2"
      unique_id: wican_pcm_intake_air_temp_2
      state_topic: "wican/INTAKE_AIR_TEMP_2"
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      icon: mdi:air-filter
      # convert from °C to °F
      value_template: '{{ ((value_json["INTAKE_AIR_TEMP_2"] | default(0) * 9/5) + 32) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Learned Octane Ratio"
      unique_id: wican_pcm_learned_octane_ratio
      state_topic: "wican/OCTANE_RATIO_L"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:percent
      # Ford learned octane ratio as the WiCAN reports it (about 0-4 on this van:
      # high = learned high-octane fuel). Keep two decimals: whole numbers hide
      # the steps between fill-ups.
      value_template: '{{ (value_json["OCTANE_RATIO_L"] | default(0)) | round(2) }}'
      suggested_display_precision: 2
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Oil Life"
      unique_id: wican_pcm_oil_life
      state_topic: "wican/OIL_LIFE"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:oil
      # raw percent
      value_template: '{{ (value_json["OIL_LIFE"]) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Transmission Fluid Temp"
      unique_id: wican_pcm_trans_fluid_temp
      state_topic: "wican/TRAN_F_TEMP"
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer
      # convert from °C to °F
      value_template: '{{ ((value_json["TRAN_F_TEMP"] | default(0) * 9/5) + 32) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Transmission Gear"
      unique_id: wican_pcm_trans_gear_cmd
      state_topic: "wican/GEAR"
      icon: mdi:car-shift-pattern
      # map numeric code to gear letter/number
      value_template: >
        {% set gear = value_json["GEAR"] | int %}
        {% if gear == 70 %} P
        {% elif gear == 60 %} R
        {% elif gear == 50 %} N
        {% elif gear == 46 %} D
        {% elif gear >= 1 and gear <= 10 %} {{ gear }}
        {% else %} Error
        {% endif %}
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    - name: "Wastegate"
      unique_id: wican_pcm_wastegate
      state_topic: "wican/WASTEGATE"
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:valve
      # percent open
      value_template: '{{ value_json["WASTEGATE"] | default(0) | round(0) }}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

#### Body Control Module ####


    - name: "Battery Charge Mode"
      unique_id: wican_bat_chrg_mode
