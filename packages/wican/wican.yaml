template:
-  sensor:
    - name: "Approximate Range"
      unique_id: 2ea4c5a0-5472-450a-8737-878177d190d1
      device_class: distance
      state_class: measurement
      unit_of_measurement: "mi"
      icon: mdi:gas-station
      # using our average MPG of 12 and 30 gal fuel tank size to approximate range
      state: >
        {{(states('sensor.wican_fuel_level') | int / 100 * 30 * 12 ) | round}}

    - name: "Boost Gauge"
      unique_id: acb537b6-473c-4860-9b1d-17703c357438
      state: >
        {% set intake_pressure = states('sensor.wican_manifold_pressure') | float(0) %}
        {% set baro_pressure = states('sensor.wican_barometric_pressure') | float(0) %}
        {{ (intake_pressure - baro_pressure) | round(2) }}
      icon: mdi:car-turbocharger
      device_class: pressure
      state_class: measurement
      unit_of_measurement: "psi"

    - name: "Engine Torque"
      unique_id: wican_torque_calc
      icon: mdi:engine
      state_class: measurement
      unit_of_measurement: "lb-ft"
      state: >
        {% set ref_torque_nm = states('sensor.wican_engine_torque_reference') | float(0) %}
        {% set torque_percent = states('sensor.wican_engine_torque_percent') | float(0) %}
        {% set actual_torque_nm = (ref_torque_nm * (torque_percent / 100)) %}
        {{ (actual_torque_nm * 0.737562) | round(0) }}

    - name: "Engine Horsepower"
      unique_id: "wican_horsepower"
      icon: mdi:engine-outline
      state_class: measurement
      unit_of_measurement: "hp"
      state: >
        {% set torque_reference_nm =  states('sensor.wican_engine_torque_reference') | float(0) %}
        {% set torque_percent =  states('sensor.wican_engine_torque_percent') | float(0) %}
        {% set rpm = states('sensor.wican_engine_speed') | float(0) %}
        {% set actual_torque_nm = (torque_reference_nm * (torque_percent / 100)) %}
        {% if actual_torque_nm > 0 and rpm > 0 %}
          {{ (actual_torque_nm * rpm / 7127) | round(0) }}
        {% else %}
          0
        {% endif %}

    - name: "Vehicle Battery Power"
      unique_id: wican_bcm_bat_power
      unit_of_measurement: "W"
      state_class: measurement
      device_class: power
      icon: mdi:flash
      state: >
        {% set voltage = states('sensor.wican_vehicle_battery_voltage') | float(0) %}
        {% set current = states('sensor.wican_vehicle_battery_current') | float(0) %}
        {{ (voltage * current) | round(1) }}

    - name: "Real Time Fuel Economy"
      unique_id: real_time_fuel_economy
      unit_of_measurement: "MPG"
      state_class: measurement
      icon: mdi:gas-station
      state: >
        {% set running = is_state('binary_sensor.engine_running', 'on') %}
        {% set mph = states('sensor.nmea_0183_gps_acm0_victron_vehicle_speed') | float(0) %}
        {% set gps = states('sensor.wican_fuel_rate_engine_running') | float(0) %}
        {% set gph = gps * 3600 / 2819 %}
        {% if not running or mph < 1 %}
          0
        {% elif gph <= 0 %}
          99
        {% else %}
          {{ [ (mph / gph), 99 ] | min | round(1) }}
        {% endif %}
      attributes:
        speed_mph: "{{ states('sensor.nmea_0183_gps_acm0_victron_vehicle_speed') | float(0) }}"
        fuel_gph: >
          {{ (states('sensor.wican_fuel_rate_engine_running') | float(0) * 3600 / 2819) | round(2) }}
        speed_source: "Victron GPS"

    - name: "Vehicle Battery Charge Mode Text"
      unique_id: wican_bat_charge_mode_text
      icon: mdi:flash
      state: >-
        {% set mode = states('sensor.wican_battery_charge_mode')|int(0) %}
        {% if mode == 0 -%}
        Conventional Charging
        {% elif mode == 1 -%}
        Slow Regen Allowed
        {% elif mode == 2 -%}
        Fast Regen Allowed
        {% elif mode == 3 -%}
        Slow Regen Allowed, NO Discharge Allowed
        {% elif mode == 4 -%}
        Battery Refresh
        {% elif mode == 5 -%}
        Battery Identity
        {%- else -%}
        Unknown
        {%- endif %}    

-  binary_sensor:
    - name: "Engine Running"
      unique_id: engine_running_sensor
      device_class: power 
      state: >
        {% set rpm = states('sensor.wican_engine_speed') | float(0) %}
        {% set obd_status = is_state('binary_sensor.wican_obd_status','on') %}
        {{ rpm > 1 and obd_status }}
      icon: >
        {% set rpm = states('sensor.wican_engine_speed') | float(0) %}
        {% set obd_status = is_state('binary_sensor.wican_obd_status','on') %}
        {% if rpm > 1 and obd_status %}
          mdi:engine
        {% else %}
          mdi:engine-off
        {% endif %}


    


mqtt:
  binary_sensor:
    #Detect of WiCAN is online
    - name: "OBD Status"
      unique_id: wican_obd_status
      state_topic: "wican/status"
      icon: mdi:state-machine
      entity_category: diagnostic
      payload_on: '{"status": "online"}'
      payload_off: '{"status": "offline"}'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    #Detect if brake pedal is pressed
    - name: "Brake On/Off"
      unique_id: wican_brake_on_off
      state_topic: "wican/PARK_BRAKE"
      icon: mdi:car-brake-hold
      value_template: '{{ (value_json["PARK_BRAKE"]) | round(0) }}'
      payload_on: '6'
      payload_off: '0'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    #Detect A/C Compressor
    - name: "A/C Compressor Status"
      unique_id: wican_ac_compressor
      state_topic: "wican/AC_COMP"
      icon: mdi:air-conditioner
      value_template: '{{ (value_json["AC_COMP"]) | round(0) }}'
      payload_on: '1'
      payload_off: '0'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    #Detect Driver Door Status
    - name: "Driver Door Status"
      unique_id: wican_driver_door_status
      state_topic: "wican/bcm-driver-ajar"
      icon: mdi:car-door
      device_class: door
      value_template: '{{ (value_json["BCM-Driver-Ajar"]) | round(0) }}'
      payload_on: '1'
      payload_off: '0'
      device:
        identifiers: ["WiCAN"]
        manufacturer: "MeatPi"
        model: "WiCAN OBD"
        name: "WiCAN"

    #Detect Passenger Door Status
