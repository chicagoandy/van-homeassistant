# =============================================================================
#  van_fuel_stop — "is the van at a fuel station?" from GPS
# =============================================================================
#  rest_command.fuel_station_nearby asks OpenStreetMap (Overpass API) how many
#  fuel stations (amenity=fuel) lie within `radius` metres of a position.
#  Call it with response_variable to read the answer:
#
#    - action: rest_command.fuel_station_nearby
#      data:
#        latitude: "{{ state_attr('device_tracker.nmea_0183_gps_acm0_location', 'latitude') }}"
#        longitude: "{{ state_attr('device_tracker.nmea_0183_gps_acm0_location', 'longitude') }}"
#      response_variable: fuel
#    # fuel.content.elements[0].tags.total  -> "0", "1", ...
#
#  rest_command.nearest_poi (Nominatim, below) is what the "Front display: longer
#  shutdown wait at fuel stations" automation uses: if the nearest point of
#  interest is amenity=fuel within 120 m, it restarts the display's shutdown
#  timer at 15 minutes. The Overpass command is kept as a spare; its public
#  servers were timing out. Needs internet; if the lookup fails, the normal
#  2-minute wait applies.
# =============================================================================

rest_command:
  fuel_station_nearby:
    # Optional `server` picks an Overpass instance; the main one is often at
    # capacity, so the automation rotates through public mirrors on retries.
    url: "{{ server | default('https://overpass-api.de/api/interpreter') }}"
    method: post
    content_type: "application/x-www-form-urlencoded"
    # Overpass answers 406 to requests without an identifying User-Agent.
    headers:
      User-Agent: "HomeAssistant-van-fuel-stop/1.0 (+https://github.com/chicagoandy/van-homeassistant)"
      Accept: "application/json"
    timeout: 15
    payload: >-
      {% set r = radius | default(75) %}
      {% set q = '[out:json][timeout:10];nwr(around:' ~ r ~ ',' ~ latitude ~ ',' ~ longitude
                 ~ ')[amenity=fuel];out count;' %}
      {{ {'data': q} | urlencode }}

  # Nominatim reverse lookup: the nearest point of interest to a position.
  # One light GET, far more reliable than Overpass. The answer has
  # category "amenity" + type "fuel" at a station, plus that place's lat/lon,
  # so the caller checks the distance. Usage policy: an identifying
  # User-Agent and no more than 1 request per second.
  #   fuel.content.category / .type / .lat / .lon / .name
  nearest_poi:
    url: >-
      https://nominatim.openstreetmap.org/reverse?format=jsonv2&layer=poi&zoom=18&lat={{ latitude }}&lon={{ longitude }}
    method: get
    headers:
      User-Agent: "HomeAssistant-van-fuel-stop/1.0 (+https://github.com/chicagoandy/van-homeassistant)"
      Accept: "application/json"
    timeout: 10
